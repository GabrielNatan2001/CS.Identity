name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore -c Release
      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal
      - name: Docker Build
        run: docker build -t gabrielnatan2001/cs-identity-api:${{ github.sha }} .
      - name: Login Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag gabrielnatan2001/cs-identity-api:${{ github.sha }} gabrielnatan2001/cs-identity-api:latest
          docker push gabrielnatan2001/cs-identity-api:${{ github.sha }}
          docker push gabrielnatan2001/cs-identity-api:latest
